name: _Changeset Check

on:
  workflow_call:
    inputs:
      base-sha:
        required: true
        type: string
      manifest-changed:
        required: true
        type: string

jobs:
  changeset-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      # These checks need no lifecycle scripts.
      - name: Install workspace dependencies
        if: ${{ inputs.manifest-changed == 'true' }}
        run: bun install --frozen-lockfile --ignore-scripts

      # Input changes such as devDependencies may leave the manifest unchanged.
      - name: Compare manifest output with base
        id: manifest_output
        if: ${{ inputs.manifest-changed == 'true' }}
        env:
          BASE_SHA: ${{ inputs.base-sha }}
        run: |
          base_dir="$RUNNER_TEMP/manifest-base"
          manifest_path='packages/maratus-manifest/dist/index.json'

          # The manifest lists components by their generated registry meta.json.
          build_manifest() {
            (cd "$1/tools/build-registry" && bun run build)
            (cd "$1/packages/maratus-manifest" && bun run build)
          }

          git worktree add --detach "$base_dir" "$BASE_SHA"
          (cd "$base_dir" && bun install --frozen-lockfile --ignore-scripts)
          build_manifest "$base_dir"
          build_manifest .

          if cmp -s "$base_dir/$manifest_path" "$manifest_path"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changeset for manifest changes
        env:
          MANIFEST_CHANGED: ${{ steps.manifest_output.outputs.changed }}
        run: |
          if [ "$MANIFEST_CHANGED" != "true" ]; then
            exit 0
          fi

          status_path='tmp/changeset-status.json'
          release_query='.releases[] | select(.name == "@maratus/manifest")'

          mkdir -p tmp
          set +e
          bun run changeset status \
            --since=${{ inputs.base-sha }} \
            --output="$status_path"
          set -e

          if [ -f "$status_path" ] && jq -e "$release_query" "$status_path" >/dev/null; then
            exit 0
          fi

          echo "Manifest changes require a changeset that releases @maratus/manifest." >&2
          exit 1
