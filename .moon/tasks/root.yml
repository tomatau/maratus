# Lockfile-only dependency updates must still re-run every task.
implicitInputs:
  - '/bun.lock'

fileGroups:
  repo-config:
    - '/repo.yml'
  components-source:
    - '/components/*/src/**/*'
    - '/components/*/package.json'
  lib-manifests:
    - '/lib/*/package.json'
  registry-meta:
    - '/registry/*/package.json'
    - '/registry/*/meta.json'
  codemod-meta:
    - '/codemods/*/package.json'
    - '/codemods/*/meta.json'
